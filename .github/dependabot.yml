version: 2

updates:
  # Keeps the commit SHAs in .github/workflows pinned to the newest release.
  # Dependabot rewrites both the SHA and its trailing version comment, so the
  # pins stay current without reverting to mutable tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # Bumps the pinned lint tools in requirements-dev.txt. Runtime requirements
  # use minimum versions and are left alone.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "black"
      - dependency-name: "ruff"
    commit-message:
      prefix: "chore"
