name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing GitHub release tag to publish to WinGet
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: false

jobs:
  publish-winget:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    steps:
      - name: Check publishing credentials
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Output "::error::Configure the WINGET_TOKEN repository secret."
            exit 1
          }
      - name: Check existing WinGet package
        id: package
        shell: pwsh
        run: |
          $uri = "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/j/jvonscheidt/ibkr-etaxstatement"
          try {
            Invoke-RestMethod -Uri $uri | Out-Null
            "exists=true" >> $env:GITHUB_OUTPUT
          } catch {
            if ($_.Exception.Response.StatusCode -ne [Net.HttpStatusCode]::NotFound) {
              throw
            }
            "exists=false" >> $env:GITHUB_OUTPUT
          }
      - name: Check out initial manifests
        if: steps.package.outputs.exists == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install WingetCreate
        if: steps.package.outputs.exists == 'false'
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe"
          Invoke-WebRequest -Uri $url -OutFile wingetcreate.exe
          $expected = "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA"
          $actual = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "WingetCreate checksum mismatch: $actual"
          }
      - name: Submit initial WinGet manifest
        if: steps.package.outputs.exists == 'false'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $manifest = Join-Path "packaging\winget" $version
          if (-not (Test-Path $manifest)) {
            throw "No checked-in WinGet manifest found at $manifest"
          }
          .\wingetcreate.exe submit `
            --prtitle "New package: jvonscheidt.ibkr-etaxstatement version $version" `
            --token $env:WINGET_TOKEN `
            --no-open `
            $manifest
      - name: Publish WinGet update
        if: steps.package.outputs.exists == 'true'
        uses: vedantmgoyal9/winget-releaser@7bd472be23763def6e16bd06cc8b1cdfab0e2fd5 # v2
        with:
          identifier: jvonscheidt.ibkr-etaxstatement
          installers-regex: '\.exe$'
          release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
          token: ${{ secrets.WINGET_TOKEN }}
